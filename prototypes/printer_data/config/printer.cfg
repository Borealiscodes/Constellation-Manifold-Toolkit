# ====================================================================================
# CONSTELLATION-MANIFOLD V4.0: KLIPPER MECHANICAL ENGINE OVERRIDES
# Document ID: 8B-AUDIT-SUP-01-2026 | Target Domain: Multi-Axis FFF Deposition
# ====================================================================================

[gcode_macro _MANIFOLD_GLOBAL_VARS]
variable_alpha_ceiling: 4.5
variable_lambda_regularization: 0.0015
variable_micron_step_size: 0.001
variable_active_backpressure: 0.000124
variable_safety_status: "NOMINAL"
gcode:
    # Virtual namespace holder for real-time 80D state telemetry registers

[gcode_macro INITIALIZE_MANIFOLD_PIPELINE]
description: Prepares the hardware gantry for high-dimensional latent matrix ingestion
gcode:
    SET_GCODE_VARIABLE MACRO=_MANIFOLD_GLOBAL_VARS VARIABLE=safety_status VALUE='"NOMINAL"'
    M117 Manifold Core V4.0 Initialized
    G90 ; Set machine toolhead pathing to absolute coordinates tracking mode
    M83 ; Force relative extrusion mapping to decouple spatial channels from absolute filament lengths
    SET_VELOCITY_LIMIT ACCEL=1500 ACCEL_TO_DECEL=750 ; Establish structural motor vector bounds

[gcode_macro EXECUTE_TERNARY_FRAME]
description: Decomposes a dithered 80D state vector macro-step down to standard FFF primitives
gcode:
    # Extract target array summaries from parameters passed over the FFI codec bridge
    {% set dx_pulses = params.DX|default(0)|int %}
    {% set dy_pulses = params.DY|default(0)|int %}
    {% set dz_pulses = params.DZ|default(0)|int %}
    {% set de_pulses = params.DE|default(0)|int %}
    {% set computed_kappa = params.KAPPA|default(1.0)|float %}
    
    # Fetch core runtime system scalars
    {% set vars = printer["gcode_macro _MANIFOLD_GLOBAL_VARS"] %}
    
    # 1. HARD MATRIX CIRCUIT BREAKER INTERCEPT (Tikhonov Regularized Limit Check)
    {% if computed_kappa > vars.alpha_ceiling %}
        SET_GCODE_VARIABLE MACRO=_MANIFOLD_GLOBAL_VARS VARIABLE=safety_status VALUE='"DETERMINISTIC_ABORT"'
        MANIFOLD_EMERGENCY_BRAKE REASON="Tikhonov Regularized Boundary Breach: Kappa={computed_kappa}"
    {% else %}
        # 2. NOMINAL PATH EXECUTION
        {% if vars.safety_status == "NOMINAL" %}
            # Convert raw ternary step integer pulses into physical millimeter displacement vectors
            {% set move_x = dx_pulses * vars.micron_step_size %}
            {% set move_y = dy_pulses * vars.micron_step_size %}
            {% set move_z = dz_pulses * vars.micron_step_size %}
            
            # Volumetric Extrusion Scale: Scaled by trace variables and physical backpressure
            {% set move_e = (de_pulses * vars.micron_step_size) * (vars.active_backpressure * 10000.0) %}
            
            # Check for spatial standstill to engage the spherepopfold cushion
            {% if dx_pulses == 0 and dy_pulses == 0 and dz_pulses == 0 %}
                # No toolhead motion: Execute micro-second dwell interval to dampen structural oscillations
                G4 P10 
            {% else %}
                # Standard linear interpolation step at maximum commanded feedrate vector
                G1 X{move_x} Y{move_y} Z{move_z} E{move_e} F1500
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro MANIFOLD_EMERGENCY_BRAKE]
description: Automated safety shutdown to drop motor torque and protect hotend substrate
gcode:
    {% set reason = params.REASON|default("Unknown Matrix Distortion Event") %}
    RESPOND TYPE=error MSG="🚨 CRITICAL: {reason}"
    
    # Instantaneous physical pressure-relief retraction token to stop gravimetric pooling
    G1 E-0.5000 F3000
    
    # Cut all electrical power loops immediately
    M104 S0 ; Turn off extruder heating elements instantly
    M140 S0 ; Turn off print bed heating elements
    M107    ; Kill power to inline curing laser arrays and part-cooling PWM fans
    
    # Drop current to stepper motor coils to completely release torque boundaries
    M84 
    
    CANCEL_PRINT
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    RESPOND MSG="❌ HARDWARE DEADBOUND LOCKED: Safe rest state achieved."
